<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MondoAI{% endblock %}</title>
    <style>
        :root {
            --bg: #f8f9fa;
            --card-bg: #fff;
            --border: #dee2e6;
            --text: #212529;
            --text-muted: #6c757d;
            --primary: #0d6efd;
            --primary-hover: #0b5ed7;
            --success: #198754;
            --warning: #ffc107;
            --danger: #dc3545;
            --info: #0dcaf0;
            --mono: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg); color: var(--text);
            line-height: 1.5;
        }
        nav {
            background: var(--text); color: #fff; padding: 0.75rem 1.5rem;
            display: flex; align-items: center; gap: 2rem;
        }
        nav a { color: #ccc; text-decoration: none; font-size: 0.9rem; }
        nav a:hover { color: #fff; }
        nav .brand { font-weight: 700; font-size: 1.1rem; color: #fff; }
        .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
        h1 { font-size: 1.5rem; margin-bottom: 1rem; }
        h2 { font-size: 1.2rem; margin-bottom: 0.75rem; color: var(--text-muted); }

        /* Cards */
        .card {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 8px; padding: 1.25rem; margin-bottom: 1rem;
        }
        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem; margin-bottom: 1.5rem;
        }
        .stat-card {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 8px; padding: 1rem; text-align: center;
        }
        .stat-card .number { font-size: 2rem; font-weight: 700; color: var(--primary); }
        .stat-card .label { font-size: 0.85rem; color: var(--text-muted); }

        /* Tables */
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 2px solid var(--border); color: var(--text-muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; }
        td { padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--border); }
        tr:hover td { background: #f1f3f5; }
        td.mono { font-family: var(--mono); font-size: 0.85rem; }

        /* Badges */
        .badge {
            display: inline-block; padding: 0.15rem 0.5rem; border-radius: 4px;
            font-size: 0.75rem; font-weight: 600;
        }
        .badge-source { background: #e7f5ff; color: #1971c2; }
        .badge-status-UNREVIEWED { background: #fff3bf; color: #e67700; }
        .badge-status-ACCEPTED { background: #d3f9d8; color: #2b8a3e; }
        .badge-status-REJECTED { background: #ffe3e3; color: #c92a2a; }
        .badge-status-CONTROVERSIAL { background: #f3d9fa; color: #862e9c; }
        .badge-direction-supports { background: #d3f9d8; color: #2b8a3e; }
        .badge-direction-disputes { background: #ffe3e3; color: #c92a2a; }
        .badge-direction-neutral { background: #e9ecef; color: #495057; }

        /* Forms */
        .filters {
            display: flex; gap: 0.75rem; align-items: center;
            flex-wrap: wrap; margin-bottom: 1rem;
        }
        .filters select, .filters input {
            padding: 0.4rem 0.6rem; border: 1px solid var(--border);
            border-radius: 4px; font-size: 0.85rem;
        }
        .filters input[type="text"] { min-width: 200px; }
        .btn {
            padding: 0.4rem 1rem; border: none; border-radius: 4px;
            background: var(--primary); color: #fff; cursor: pointer;
            font-size: 0.85rem;
        }
        .btn:hover { background: var(--primary-hover); }
        .btn-sm { padding: 0.25rem 0.6rem; font-size: 0.8rem; }
        .btn-outline {
            background: transparent; color: var(--primary);
            border: 1px solid var(--primary);
        }
        .btn-outline:hover { background: var(--primary); color: #fff; }

        /* Pagination */
        .pagination {
            display: flex; gap: 0.5rem; align-items: center;
            justify-content: center; margin-top: 1rem;
        }
        .pagination a {
            padding: 0.3rem 0.7rem; border: 1px solid var(--border);
            border-radius: 4px; text-decoration: none; color: var(--text);
            font-size: 0.85rem;
        }
        .pagination a:hover { background: #e9ecef; }
        .pagination .current {
            background: var(--primary); color: #fff;
            border-color: var(--primary);
        }
        .pagination .info { color: var(--text-muted); font-size: 0.85rem; }

        /* Detail page */
        .detail-header { margin-bottom: 1.5rem; }
        .detail-header .packet-id { font-family: var(--mono); font-size: 0.9rem; color: var(--text-muted); }
        .field-grid {
            display: grid; grid-template-columns: 140px 1fr;
            gap: 0.25rem 1rem; font-size: 0.9rem; margin-bottom: 1rem;
        }
        .field-label { font-weight: 600; color: var(--text-muted); }
        .evidence-item {
            border-left: 3px solid var(--primary); padding: 0.75rem 1rem;
            margin-bottom: 0.75rem; background: #f8f9fa; border-radius: 0 4px 4px 0;
        }
        .evidence-item.concordance { border-left-color: var(--info); }
        .evidence-item.document { border-left-color: var(--success); }
        .evidence-item.agent { border-left-color: var(--warning); }
        .evidence-item.computational { border-left-color: #845ef7; }

        /* Distribution bars */
        .dist-table td.bar-cell { width: 50%; }
        .bar-container { background: #e9ecef; border-radius: 3px; height: 20px; position: relative; }
        .bar-fill { height: 100%; border-radius: 3px; background: var(--primary); min-width: 2px; }
        .bar-label { position: absolute; right: 6px; top: 1px; font-size: 0.75rem; color: var(--text-muted); }

        a { color: var(--primary); }
        a:hover { color: var(--primary-hover); }
        .text-muted { color: var(--text-muted); }
        .truncate { max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="brand">MondoAI</a>
        <a href="/">Dashboard</a>
        <a href="/packets">Packets</a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
