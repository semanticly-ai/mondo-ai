id: https://w3id.org/monarch-initiative/mondo-ai
name: mondo_ai_sieve
title: MondoAI Data Model (SIEVE profile)
description: >-
  Data models for the mondo-ai evidence pipeline. Evidence packets are SIEVE profile
  packets (sieve.yaml, vendored verbatim from the sieve repository together with the
  SEPIO core it imports). This overlay adds only the classes mondo-ai uses to hold
  source ontologies in a local, versioned form before they become evidence:
  ResourceSnapshot, EntitySnapshot, Synonym and EntityMapping.

prefixes:
  linkml: https://w3id.org/linkml/
  mondoai: https://w3id.org/monarch-initiative/mondo-ai/
  sieve: https://w3id.org/sieve/
  MONDO: http://purl.obolibrary.org/obo/MONDO_
  OMIM: https://omim.org/entry/
  Orphanet: http://www.orpha.net/ORDO/Orphanet_
  DOID: http://purl.obolibrary.org/obo/DOID_
  ICD10CM: http://purl.bioontology.org/ontology/ICD10CM/
  oio: http://www.geneontology.org/formats/oboInOwl#
  skos: http://www.w3.org/2004/02/skos/core#

imports:
  - linkml:types
  - sieve

default_range: string
default_prefix: mondoai


classes:

  ResourceSnapshot:
    description: >-
      Extracted content from a source ontology at a specific version. This is the
      preprocessed, versioned snapshot a SourceRelease points at (D-058).
    attributes:
      resource_id:
        identifier: true
        range: uriorcurie
        description: Unique identifier for this resource (e.g., "omim", "ordo", "doid")
      resource_name:
        range: string
        description: Human-readable name of the resource
      resource_url:
        range: uri
        description: URL or path the resource was read from
      version:
        range: string
        description: Version identifier of the source
      generated_at:
        range: datetime
        description: Timestamp when this snapshot was generated
      checksum:
        range: string
        description: SHA256 checksum of the source file
      entity_count:
        range: integer
        description: Number of entities in this snapshot
      entities:
        multivalued: true
        range: EntitySnapshot
        inlined_as_list: true
        description: List of extracted entities

  EntitySnapshot:
    description: Extracted entity data from a source ontology.
    attributes:
      id:
        identifier: true
        range: uriorcurie
        description: Source entity identifier (e.g., OMIM:123456)
      label:
        range: string
        description: Primary label/name of the entity
      synonyms:
        multivalued: true
        range: Synonym
        inlined_as_list: true
        description: List of synonyms for this entity
      definition:
        range: string
        description: Definition text
      parents:
        multivalued: true
        range: uriorcurie
        description: Direct named parent entity IDs (rdfs:subClassOf)
      classification_parents:
        multivalued: true
        range: uriorcurie
        description: >-
          Parents asserted through a classification relation rather than
          rdfs:subClassOf, e.g. ORDO's part_of (BFO:0000050) groups.
      mappings:
        multivalued: true
        range: EntityMapping
        inlined_as_list: true
        description: Cross-references and mappings to other ontologies
      deprecated:
        range: boolean
        description: Whether this entity is deprecated/obsolete
      definition_orcids:
        range: string
        multivalued: true
        description: ORCID identifiers found in definition sources
      definition_pmids:
        range: string
        multivalued: true
        description: PMID identifiers found in definition sources

  Synonym:
    description: A synonym with scope and source information.
    attributes:
      value:
        range: string
        required: true
        description: The synonym text
      scope:
        range: SynonymScope
        description: Scope of the synonym (exact, narrow, broad, related)
      type:
        range: string
        description: Synonym type CURIE (e.g., OMO:0003000 abbreviation)
      source:
        range: uriorcurie
        description: Source of this synonym assertion
      orcids:
        range: string
        multivalued: true
        description: ORCID identifiers found in annotation sources
      pmids:
        range: string
        multivalued: true
        description: PMID identifiers found in annotation sources

  EntityMapping:
    description: A mapping/cross-reference to another ontology entity.
    attributes:
      object_id:
        range: uriorcurie
        required: true
        description: Target entity ID, normalised to its Bioregistry prefix
      predicate_id:
        range: uriorcurie
        description: Mapping predicate as asserted (e.g., skos:exactMatch, oboInOwl:hasDbXref)
      mapping_source:
        range: string
        description: >-
          The source's own qualifier of the mapping, e.g. ORDO's ECC precision code
          ("E", "NTBT", "BTNT").


enums:

  SynonymScope:
    description: Scope of a synonym assertion.
    permissible_values:
      EXACT:
        description: Exact synonym (oboInOwl:hasExactSynonym)
      NARROW:
        description: Narrow synonym (oboInOwl:hasNarrowSynonym)
      BROAD:
        description: Broad synonym (oboInOwl:hasBroadSynonym)
      RELATED:
        description: Related synonym (oboInOwl:hasRelatedSynonym)
