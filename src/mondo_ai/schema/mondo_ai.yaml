id: https://w3id.org/monarch-initiative/mondo-ai
name: mondo_ai
title: MondoAI Data Model
description: >-
  Data models for AI-assisted evidence-driven sync pipeline for curating
  content into the Mondo disease ontology.

prefixes:
  linkml: https://w3id.org/linkml/
  mondoai: https://w3id.org/monarch-initiative/mondo-ai/
  MONDO: http://purl.obolibrary.org/obo/MONDO_
  OMIM: https://omim.org/entry/
  Orphanet: http://www.orpha.net/ORDO/Orphanet_
  DOID: http://purl.obolibrary.org/obo/DOID_
  eco: http://purl.obolibrary.org/obo/ECO_
  oio: http://www.geneontology.org/formats/oboInOwl#
  IAO: http://purl.obolibrary.org/obo/IAO_
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  skos: http://www.w3.org/2004/02/skos/core#

imports:
  - linkml:types

default_range: string
default_prefix: mondoai


# =============================================================================
# CLASSES
# =============================================================================

classes:

  # ---------------------------------------------------------------------------
  # Resource Extraction Models
  # ---------------------------------------------------------------------------

  ResourceSnapshot:
    description: >-
      Extracted content from a source ontology at a specific version.
    attributes:
      resource_id:
        identifier: true
        range: uriorcurie
        description: Unique identifier for this resource (e.g., "omim", "ordo", "doid")
      resource_name:
        range: string
        description: Human-readable name of the resource
      resource_url:
        range: uri
        description: URL where the resource was downloaded from
      version:
        range: string
        description: Version identifier of the source
      generated_at:
        range: datetime
        description: Timestamp when this snapshot was generated
      checksum:
        range: string
        description: SHA256 checksum of the source file
      entity_count:
        range: integer
        description: Number of entities in this snapshot
      entities:
        multivalued: true
        range: EntitySnapshot
        inlined_as_list: true
        description: List of extracted entities

  EntitySnapshot:
    description: Extracted entity data from a source ontology.
    attributes:
      id:
        identifier: true
        range: uriorcurie
        description: Source entity identifier (e.g., OMIM:123456)
      label:
        range: string
        description: Primary label/name of the entity
      synonyms:
        multivalued: true
        range: Synonym
        inlined_as_list: true
        description: List of synonyms for this entity
      definition:
        range: string
        description: Definition text
      parents:
        multivalued: true
        range: uriorcurie
        description: Direct parent entity IDs (rdfs:subClassOf)
      mappings:
        multivalued: true
        range: EntityMapping
        inlined_as_list: true
        description: Cross-references and mappings to other ontologies
      deprecated:
        range: boolean
        description: Whether this entity is deprecated/obsolete

  Synonym:
    description: A synonym with scope and source information.
    attributes:
      value:
        range: string
        required: true
        description: The synonym text
      scope:
        range: SynonymScope
        description: Scope of the synonym (exact, narrow, broad, related)
      type:
        range: string
        description: Type of synonym (e.g., acronym, abbreviation)
      source:
        range: uriorcurie
        description: Source of this synonym assertion

  EntityMapping:
    description: A mapping/cross-reference to another ontology entity.
    attributes:
      object_id:
        range: uriorcurie
        required: true
        description: Target entity ID
      predicate_id:
        range: uriorcurie
        description: Mapping predicate (e.g., skos:exactMatch)
      mapping_source:
        range: string
        description: Source of this mapping

  # ---------------------------------------------------------------------------
  # Canonical Statements (Mondo-space)
  # ---------------------------------------------------------------------------

  CanonicalStatement:
    description: >-
      A statement about a Mondo entity derived from external sources.
      Statements are the unit of comparison and evidence gathering.
    attributes:
      statement_id:
        identifier: true
        range: string
        description: Deterministic ID (SHA256 hash of subject + predicate + object)
      subject_mondo_id:
        range: uriorcurie
        required: true
        description: Mondo entity ID this statement is about
      subject_label:
        range: string
        description: Label of the Mondo entity
      predicate:
        range: StatementPredicate
        required: true
        description: Type of statement (synonym, parent, etc.)
      object_value:
        range: string
        required: true
        description: >-
          Value of the statement. For synonyms this is the synonym text,
          for hierarchy this is the parent label.
      object_id:
        range: uriorcurie
        description: >-
          For predicates with entity targets (like PARENT), this is the
          target entity's CURIE.

  # ---------------------------------------------------------------------------
  # Evidence Packet Models
  # ---------------------------------------------------------------------------

  EvidencePacket:
    description: >-
      A package of evidence for a candidate statement. This is the primary
      output unit of the MondoAI pipeline.
    attributes:
      id:
        identifier: true
        range: string
        description: Unique packet identifier
      statement:
        range: CanonicalStatement
        required: true
        inlined: true
        description: The statement this packet provides evidence for
      bucket:
        range: PacketBucket
        required: true
        description: Whether this is NEW to Mondo or CONFIRMS existing
      provenance:
        range: AssertionProvenance
        inlined: true
        description: Origin and attribution of the assertion
      evidence:
        multivalued: true
        range: Evidence
        inlined_as_list: true
        description: List of evidence items
      evidence_score:
        range: float
        minimum_value: -1
        maximum_value: 1
        description: >-
          Net Evidence Ratio: (S+ - S-) / (S+ + S- + S?)
          Ranges from -1 (all contradicting) to +1 (all supporting)
      evidence_synthesis:
        range: EvidenceSynthesis
        inlined: true
        description: AI-synthesized evidence synthesis
      status:
        range: CurationStatus
        ifabsent: string(UNREVIEWED)
        description: Curation status of this packet
      curator_orcid:
        range: uriorcurie
        description: ORCID of curator who reviewed this packet
      created_at:
        range: datetime
        description: When this packet was created
      updated_at:
        range: datetime
        description: When this packet was last updated

  AssertionProvenance:
    description: Origin and attribution of the assertion.
    attributes:
      attributed_to:
        multivalued: true
        range: uriorcurie
        description: ORCIDs or identifiers of original creators
      generated_at:
        range: date
        description: When the assertion was generated
      source_version:
        range: string
        description: Version identifier of source (e.g., "OMIM 2024-05-01")
      source_uri:
        range: uri
        description: URI of the source resource

  # ---------------------------------------------------------------------------
  # Evidence Models (Abstract base + Subtypes)
  # ---------------------------------------------------------------------------

  Evidence:
    abstract: true
    description: Base class for all evidence types.
    attributes:
      id:
        identifier: true
        range: string
        description: Unique evidence item identifier
      evidence_type:
        range: EvidenceType
        required: true
        description: Type of evidence (CONCORDANCE, LITERATURE, COMPUTATIONAL)
      direction:
        range: EvidenceDirection
        ifabsent: string(SUPPORTS)
        description: Whether this evidence supports or contradicts
      evidence_strength:
        range: float
        ifabsent: float(1.0)
        minimum_value: 0
        maximum_value: 1
        description: Strength of this evidence (0=weak, 1=strong)
      eco_code:
        range: uriorcurie
        description: Evidence & Conclusion Ontology code
      eco_label:
        range: string
        description: Label of the ECO term
      description:
        range: string
        description: Human-readable description of this evidence

  ConcordanceEvidence:
    is_a: Evidence
    class_uri: mondoai:ConcordanceEvidence
    description: Evidence from cross-ontology/source agreement.
    attributes:
      source_resource:
        range: uriorcurie
        required: true
        description: Resource ID this evidence comes from (e.g., "omim")
      source_resource_name:
        range: string
        description: Human-readable name of the source
      source_entity_id:
        range: uriorcurie
        required: true
        description: Source entity ID that provides this evidence
      source_entity_label:
        range: string
        description: Label of the source entity
      mapping_predicate:
        range: uriorcurie
        description: SSSOM predicate mapping source to Mondo
      mapping_justification:
        range: uriorcurie
        description: SSSOM mapping justification
      reliability_weight:
        range: float
        ifabsent: float(1.0)
        description: Source-specific reliability weight from config

  LiteratureEvidence:
    is_a: Evidence
    class_uri: mondoai:LiteratureEvidence
    description: Evidence from published literature.
    attributes:
      publication_id:
        range: uriorcurie
        required: true
        description: Publication identifier (e.g., PMID:12345678)
      publication_title:
        range: string
        description: Title of the publication
      publication_year:
        range: integer
        description: Year of publication
      quoted_text:
        range: string
        description: Verbatim excerpt from publication
      quote_location:
        range: string
        description: Section/page/paragraph reference
      explanation:
        range: string
        description: How the quoted text supports/contradicts the statement

  ComputationalEvidence:
    is_a: Evidence
    class_uri: mondoai:ComputationalEvidence
    description: Algorithmically computed evidence.
    attributes:
      method:
        range: string
        description: Name or description of the method
      method_uri:
        range: uriorcurie
        description: URI identifying the method
      confidence_score:
        range: float
        description: Confidence score from the method
      parameters:
        range: string
        description: Parameters used in the computation

  # ---------------------------------------------------------------------------
  # Evidence Synthesis (AI-generated)
  # ---------------------------------------------------------------------------

  EvidenceSynthesis:
    description: AI-synthesized summary and recommendation for an assertion.
    attributes:
      summary:
        range: string
        required: true
        description: Textual summary synthesizing the evidence for the assertion
      confidence:
        range: float
        required: true
        minimum_value: 0
        maximum_value: 1
        description: Confidence score (0-1) reflecting how strongly the agent supports the assertion
      action:
        range: RecommendedAction
        description: Recommended action for this statement (ADD, CONFIRM, REJECT, REVIEW)
      cited_evidence:
        multivalued: true
        range: string
        description: Evidence IDs cited in the synthesis
      model_id:
        range: string
        description: AI model used (e.g., "claude-sonnet-4-20250514")
      prompt_version:
        range: string
        description: Version of the prompt template used
      generated_at:
        range: datetime
        description: When this synthesis was generated

  # ---------------------------------------------------------------------------
  # Pipeline Run Metadata
  # ---------------------------------------------------------------------------

  PipelineRun:
    description: Metadata for a pipeline execution run.
    attributes:
      run_id:
        identifier: true
        range: string
        description: Unique run identifier (typically timestamp-based)
      started_at:
        range: datetime
        required: true
      completed_at:
        range: datetime
      status:
        range: RunStatus
        description: Status of the run
      config_snapshot:
        range: string
        description: JSON-serialized config used for this run
      sources_processed:
        multivalued: true
        range: string
        description: List of source IDs processed
      packets_created:
        range: integer
        description: Number of evidence packets created
      packets_new:
        range: integer
        description: Number of NEW bucket packets
      packets_confirm:
        range: integer
        description: Number of CONFIRM bucket packets
      error_message:
        range: string
        description: Error message if run failed


# =============================================================================
# ENUMS
# =============================================================================

enums:

  SynonymScope:
    description: Scope of a synonym assertion.
    permissible_values:
      EXACT:
        description: Exact synonym (oio:hasExactSynonym)
      NARROW:
        description: Narrow synonym (oio:hasNarrowSynonym)
      BROAD:
        description: Broad synonym (oio:hasBroadSynonym)
      RELATED:
        description: Related synonym (oio:hasRelatedSynonym)

  StatementPredicate:
    description: Type of statement being asserted.
    permissible_values:
      EXACT_SYNONYM:
        description: Exact synonym assertion
      NARROW_SYNONYM:
        description: Narrow synonym assertion
      BROAD_SYNONYM:
        description: Broad synonym assertion
      RELATED_SYNONYM:
        description: Related synonym assertion
      LABEL:
        description: Primary label assertion
      DEFINITION:
        description: Definition text assertion
      PARENT:
        description: rdfs:subClassOf parent assertion

  PacketBucket:
    description: Classification of evidence packet relative to Mondo.
    permissible_values:
      NEW:
        description: Statement not currently present in Mondo
      CONFIRM:
        description: Statement already present in Mondo

  EvidenceType:
    description: Type of evidence (determines concrete class).
    permissible_values:
      CONCORDANCE:
        description: Cross-ontology/source agreement
        meaning: mondoai:ConcordanceEvidence
      LITERATURE:
        description: Published literature evidence
        meaning: mondoai:LiteratureEvidence
      COMPUTATIONAL:
        description: Algorithmically computed evidence
        meaning: mondoai:ComputationalEvidence

  EvidenceDirection:
    description: Whether evidence supports or contradicts the statement.
    permissible_values:
      SUPPORTS:
        description: Evidence supports the statement
      CONTRADICTS:
        description: Evidence contradicts the statement
      UNCERTAIN:
        description: Direction is uncertain or neutral

  CurationStatus:
    description: Status of curation review.
    permissible_values:
      UNREVIEWED:
        description: Not yet reviewed (default)
      ACCEPTED:
        description: Approved by curator
      REJECTED:
        description: Rejected by curator
      CONTROVERSIAL:
        description: Conflicting opinions, requires discussion

  RecommendedAction:
    description: AI-recommended action for a statement.
    permissible_values:
      ADD:
        description: Recommend adding this statement to Mondo
      CONFIRM:
        description: Confirm existing assertion is correct
      REJECT:
        description: Recommend rejecting this statement
      REVIEW:
        description: Requires human review (uncertain)

  RunStatus:
    description: Status of a pipeline run.
    permissible_values:
      RUNNING:
        description: Run is currently in progress
      COMPLETED:
        description: Run completed successfully
      FAILED:
        description: Run failed with error
      CANCELLED:
        description: Run was cancelled
