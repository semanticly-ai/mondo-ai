[mypy]
exclude = src/mondo_ai/datamodel/sieve_models\.py

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-pytest.*]
ignore_missing_imports = True

[mypy-typer.*]
ignore_missing_imports = True

# sieve_models.py is generated by `gen-pydantic`; do not type-check generated code.
[mypy-mondo_ai.datamodel.sieve_models]
ignore_errors = True


# sieve (editable path dependency) and linkml ship no py.typed marker: read sieve's
# annotations, treat linkml as untyped.
[mypy-sieve.*]
follow_untyped_imports = True
ignore_errors = True

[mypy-linkml_runtime.*,linkml.*]
ignore_missing_imports = True
follow_untyped_imports = False
disable_error_code = import-untyped
