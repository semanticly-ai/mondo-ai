# Generated by `just align-valueset` from mondo_ai.align.rules. Do not hand-edit.
id: https://w3id.org/mapping-rules/maprule
name: maprule
title: Mapping curation rules
description: "Named, citable rules for curating and reviewing mappings. A mapping decision is only\
  \ meaningful relative to the rules it was made under; these ids are what SSSOM curation_rule cells\
  \ carry. Generated by `just align-valueset` from mondo_ai.align.rules \u2014 do not hand-edit."
license: https://creativecommons.org/publicdomain/zero/1.0/
prefixes:
  maprule:
    prefix_prefix: maprule
    prefix_reference: https://w3id.org/mapping-rules/
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  skos:
    prefix_prefix: skos
    prefix_reference: http://www.w3.org/2004/02/skos/core#
default_prefix: maprule
default_range: string
imports:
- linkml:types
enums:
  MappingCurationRule:
    description: Every rule in the registry, across all six families.
    permissible_values:
      EV-001:
        description: exact match on primary label. Subject and object primary labels are identical.
          High confidence, very low cost.
        meaning: maprule:EV-001
        annotations:
          family: EV
          blocks_exact_match: false
          is_rejection_ground: false
      EV-002:
        description: exact match on normalised label. Identical after non-semantic normalisation only
          (case, accents, punctuation, whitespace). Equivalent in strength to EV-001.
        meaning: maprule:EV-002
        annotations:
          family: EV
          blocks_exact_match: false
          is_rejection_ground: false
      EV-003:
        description: exact match on exact synonym. One side's primary label equals the other's exact
          synonym. Medium-to-high confidence.
        meaning: maprule:EV-003
        annotations:
          family: EV
          blocks_exact_match: false
          is_rejection_ground: false
      EV-004:
        description: match after declared lexical transformation. Matched only after a documented,
          bounded rewrite (possessive, word order, British/American spelling, disease/disorder). The
          rule is recorded in subject_preprocessing.
        meaning: maprule:EV-004
        annotations:
          family: EV
          blocks_exact_match: false
          is_rejection_ground: false
      EV-005:
        description: proxy mapping via third resource. Both sides already map to the same concept
          in a trusted third resource.
        meaning: maprule:EV-005
        annotations:
          family: EV
          blocks_exact_match: false
          is_rejection_ground: false
      EV-006:
        description: "lexical similarity only. Low edit distance, or one label contained in the other.\
          \ Low confidence \u2014 never sufficient alone for exactMatch."
        meaning: maprule:EV-006
        annotations:
          family: EV
          blocks_exact_match: false
          is_rejection_ground: false
      EV-007:
        description: synonym similarity. Non-exact synonym overlap. Low confidence, not sufficient
          alone.
        meaning: maprule:EV-007
        annotations:
          family: EV
          blocks_exact_match: false
          is_rejection_ground: false
      EV-008:
        description: hierarchical corroboration. Parents, children or linked features are comparable.
          Medium confidence. A failing hierarchical comparison is weak evidence against, because primary
          organising relationships rarely correspond across semantic spaces.
        meaning: maprule:EV-008
        annotations:
          family: EV
          blocks_exact_match: false
          is_rejection_ground: false
      EV-009:
        description: definition comparison. Textual definitions were compared. Medium-to-high confidence,
          high cost.
        meaning: maprule:EV-009
        annotations:
          family: EV
          blocks_exact_match: false
          is_rejection_ground: false
      EV-010:
        description: full expert review. An expert aggregated hierarchy, axioms, definitions and external
          sources.
        meaning: maprule:EV-010
        annotations:
          family: EV
          blocks_exact_match: false
          is_rejection_ground: false
      EV-011:
        description: external source confirmation. The mapping is asserted by the source itself, via
          an explicit exact match.
        meaning: maprule:EV-011
        annotations:
          family: EV
          blocks_exact_match: false
          is_rejection_ground: false
      EV-012:
        description: automated adjudication over retrieved candidates. Candidates were retrieved lexically
          and a model judged equivalence. Records the reasoning; does not by itself license a curated
          assertion.
        meaning: maprule:EV-012
        annotations:
          family: EV
          blocks_exact_match: false
          is_rejection_ground: false
      SC-001:
        description: undefined residual subset ("Other X"). Object is a semantically undefined remainder
          class. MUST NOT be an exactMatch, even when the subject disease is listed under it as an
          inclusion term.
        meaning: maprule:SC-001
        annotations:
          family: SC
          blocks_exact_match: true
          is_rejection_ground: false
      SC-002:
        description: '"unspecified" or "excluding X" rubric. Object is scoped by exclusion; its extension
          is not stable. MUST NOT be an exactMatch.'
        meaning: maprule:SC-002
        annotations:
          family: SC
          blocks_exact_match: true
          is_rejection_ground: false
      SC-003:
        description: '"related conditions" grouping. Object is an open-ended association bucket. MUST
          be skos:relatedMatch.'
        meaning: maprule:SC-003
        annotations:
          family: SC
          blocks_exact_match: true
          is_rejection_ground: false
      SC-004:
        description: disjunctive rubric. Object names two or more distinct diseases and is broader
          by construction. Not an exactMatch.
        meaning: maprule:SC-004
        annotations:
          family: SC
          blocks_exact_match: true
          is_rejection_ground: false
      SC-005:
        description: target finer than subject. Object is a site, laterality, encounter, severity
          or stage variant. Object is narrower.
        meaning: maprule:SC-005
        annotations:
          family: SC
          blocks_exact_match: true
          is_rejection_ground: false
      SC-006:
        description: subtype under type-agnostic rubric. Subject is a subtype and the object is the
          rubric that abstracts over it. Object is broader. Not an exactMatch unless SC-008 is declared.
        meaning: maprule:SC-006
        annotations:
          family: SC
          blocks_exact_match: true
          is_rejection_ground: false
      SC-007:
        description: rubric coextensive with subject. The object's own subdivisions are all subtypes
          of the subject concept, so their extensions coincide. exactMatch is correct, including when
          the rubric's label carries 'unspecified'. Distinguishing this from SC-001 is the hardest
          judgement in this registry.
        meaning: maprule:SC-007
        annotations:
          family: SC
          blocks_exact_match: false
          is_rejection_ground: false
      SC-008:
        description: granularity tolerance declared. The use case explicitly permits mapping up to
          the next best available concept. The predicate MUST still reflect the true relation.
        meaning: maprule:SC-008
        annotations:
          family: SC
          blocks_exact_match: false
          is_rejection_ground: false
      PR-001:
        description: same real-world concept. Subject and object denote the same disease.
        meaning: maprule:PR-001
        annotations:
          family: PR
          blocks_exact_match: false
          is_rejection_ground: false
      PR-002:
        description: "object is a subclass. No target concept equals the subject; the object is narrower\
          \ \u2192 skos:narrowMatch."
        meaning: maprule:PR-002
        annotations:
          family: PR
          blocks_exact_match: false
          is_rejection_ground: false
      PR-003:
        description: "object is a superclass. No target concept equals the subject; the object is\
          \ broader \u2192 skos:broadMatch."
        meaning: maprule:PR-003
        annotations:
          family: PR
          blocks_exact_match: false
          is_rejection_ground: false
      PR-004:
        description: "object is a sibling. \u2192 skos:closeMatch."
        meaning: maprule:PR-004
        annotations:
          family: PR
          blocks_exact_match: false
          is_rejection_ground: false
      PR-005:
        description: "conceptually related only. No exact, broad, narrow or close fit \u2192 skos:relatedMatch.\
          \ Should be rare."
        meaning: maprule:PR-005
        annotations:
          family: PR
          blocks_exact_match: false
          is_rejection_ground: false
      PR-006:
        description: exactMatch is not OWL equivalence. skos:exactMatch asserts referential sameness
          for integration purposes, not owl:equivalentClass.
        meaning: maprule:PR-006
        annotations:
          family: PR
          blocks_exact_match: false
          is_rejection_ground: false
      PR-007:
        description: prefer exact or broad. closeMatch and relatedMatch are hard to use analytically;
          an exclusion reason MUST be given where the external concept is out of scope.
        meaning: maprule:PR-007
        annotations:
          family: PR
          blocks_exact_match: false
          is_rejection_ground: false
      PR-008:
        description: "ambiguity is not a match. Two or more equally defensible candidates \u2192 assert\
          \ nothing."
        meaning: maprule:PR-008
        annotations:
          family: PR
          blocks_exact_match: true
          is_rejection_ground: false
      ST-001:
        description: proxy merge. Two object concepts from one resource both exactMatch a single subject.
          Disallowed for precise mappings; a core curator must resolve it.
        meaning: maprule:ST-001
        annotations:
          family: ST
          blocks_exact_match: false
          is_rejection_ground: false
      ST-002:
        description: reverse proxy merge. Two subject concepts both exactMatch a single object id.
          Disallowed at every tier.
        meaning: maprule:ST-002
        annotations:
          family: ST
          blocks_exact_match: false
          is_rejection_ground: false
      ST-003:
        description: object identifier must exist. The object id must be a real, current identifier
          in the target vocabulary at the declared version.
        meaning: maprule:ST-003
        annotations:
          family: ST
          blocks_exact_match: true
          is_rejection_ground: true
      ST-004:
        description: object must not be obsolete. Deprecated or obsoleted target concepts must not
          carry exact matches.
        meaning: maprule:ST-004
        annotations:
          family: ST
          blocks_exact_match: true
          is_rejection_ground: true
      ST-005:
        description: identifier is not a code. The object id is a chapter range or belongs to a different
          vocabulary than its prefix claims. Invalid regardless of the label's plausibility.
        meaning: maprule:ST-005
        annotations:
          family: ST
          blocks_exact_match: true
          is_rejection_ground: true
      ST-006:
        description: subject must be in scope. The subject must be a disease, not a phenotypic feature
          or a gene.
        meaning: maprule:ST-006
        annotations:
          family: ST
          blocks_exact_match: true
          is_rejection_ground: false
      RJ-001:
        description: no candidate found. Nothing in the target vocabulary denotes this concept.
        meaning: maprule:RJ-001
        annotations:
          family: RJ
          blocks_exact_match: false
          is_rejection_ground: true
      RJ-002:
        description: ambiguous candidates. Several defensible candidates, none clearly best.
        meaning: maprule:RJ-002
        annotations:
          family: RJ
          blocks_exact_match: false
          is_rejection_ground: true
      RJ-003:
        description: "homonym. Labels agree but the concepts differ \u2014 the classic failure mode\
          \ of label-only evidence."
        meaning: maprule:RJ-003
        annotations:
          family: RJ
          blocks_exact_match: false
          is_rejection_ground: true
      RJ-004:
        description: token overlap only. Candidate shares words but denotes a different disease. Retrieval
          noise.
        meaning: maprule:RJ-004
        annotations:
          family: RJ
          blocks_exact_match: false
          is_rejection_ground: true
      RJ-005:
        description: target out of scope. The target concept is not a disease under the subject resource's
          model.
        meaning: maprule:RJ-005
        annotations:
          family: RJ
          blocks_exact_match: true
          is_rejection_ground: true
      CM-001:
        description: disease/disorder conflation. Subject and object are technically distinct as disease
          vs disorder; conflated as acceptable.
        meaning: maprule:CM-001
        annotations:
          family: CM
          blocks_exact_match: false
          is_rejection_ground: false
      CM-002:
        description: disease/phenotype conflation, murky case. The object is modelled as a sign, symptom
          or clinical finding while the subject is a disease, and the distinction is genuinely unclear.
          Conflated to avoid losing associations. Acceptable.
        meaning: maprule:CM-002
        annotations:
          family: CM
          blocks_exact_match: false
          is_rejection_ground: false
      CM-003:
        description: disease/phenotype distinction clear-cut. Same shape as CM-002 but the distinction
          is unambiguous. Rejection ground.
        meaning: maprule:CM-003
        annotations:
          family: CM
          blocks_exact_match: true
          is_rejection_ground: true
      CM-004:
        description: finding-vs-disorder conflation. Target separates clinical finding from disorder,
          as SNOMED does. Conflated deliberately.
        meaning: maprule:CM-004
        annotations:
          family: CM
          blocks_exact_match: false
          is_rejection_ground: false
      CM-005:
        description: etiological vs phenomenological divergence. The same clinical picture is individuated
          by cause in one resource and by presentation in the other. Conflated where the use case
          does not distinguish them.
        meaning: maprule:CM-005
        annotations:
          family: CM
          blocks_exact_match: false
          is_rejection_ground: false
      CM-006:
        description: "susceptibility vs disease. Subject is a susceptibility or predisposition locus;\
          \ object is the clinical disease. Rejection ground \u2014 these are not the same entity."
        meaning: maprule:CM-006
        annotations:
          family: CM
          blocks_exact_match: true
          is_rejection_ground: true
      CM-007:
        description: gene-centric vs disease-centric. One side denotes a gene or molecular defect,
          the other a disease. Rejection ground.
        meaning: maprule:CM-007
        annotations:
          family: CM
          blocks_exact_match: true
          is_rejection_ground: true
      CM-008:
        description: cross-species analog. Entities are analogous across organisms rather than identical.
          Conflate only if the use case explicitly permits it.
        meaning: maprule:CM-008
        annotations:
          family: CM
          blocks_exact_match: false
          is_rejection_ground: false
      CM-009:
        description: injury/event vs inherited condition. Target rubric denotes an acute event or
          procedural complication where the subject denotes an inherited trait. Rejection ground.
        meaning: maprule:CM-009
        annotations:
          family: CM
          blocks_exact_match: true
          is_rejection_ground: true
  CurationRuleFamily:
    description: The six families the rules are grouped into.
    permissible_values:
      EV:
        description: Evidence for sameness. What was actually observed that supports the mapping.
          Records evidence, not a verdict.
        meaning: maprule:EV
      SC:
        description: Scope, granularity and undefined subsets. Where the two concepts differ in extension
          rather than in kind.
        meaning: maprule:SC
      PR:
        description: 'Predicate selection. Which predicate the relation found actually licenses. Direction
          convention: in `subject predicate object`, `skos:narrowMatch` means the OBJECT is narrower.'
        meaning: maprule:PR
      ST:
        description: Structural integrity. Checks over the set rather than the row. Violations are
          set-level defects.
        meaning: maprule:ST
      RJ:
        description: Rejection grounds. Terminal outcomes. A rejection is a finding and is recorded,
          not dropped.
        meaning: maprule:RJ
      CM:
        description: Conceptual model conflation (disease / phenotype). The two resources hold genuinely
          different models of what an entity is, and the curator crossed that boundary knowingly.
          Conflation is a decision, not an error.
        meaning: maprule:CM
classes:
  CurationRuleAnnotation:
    description: The facts a consumer needs about a cited rule in order to act on it, rather than
      merely display it.
    slots:
    - rule
    - family
    - blocks_exact_match
    - is_rejection_ground
slots:
  rule:
    range: MappingCurationRule
    identifier: true
    description: The rule being annotated.
  family:
    range: CurationRuleFamily
    description: The family the rule belongs to.
  blocks_exact_match:
    range: boolean
    description: Whether this rule, once it fires, forbids skos:exactMatch.
  is_rejection_ground:
    range: boolean
    description: Whether this rule is a terminal reason not to map at all.
