[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "mondo_ai"
description = "AI-powered tools for Mondo disease ontology curation and quality assurance."
authors = [
  {name = "Nicolas Matentzoglu", email = "nico@semanticly.ai"},
]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dynamic = ["version"]

dependencies = [
  "typer >= 0.9.0",
  "linkml-runtime >=1.9.4",
  # RDF handling
  "pyoxigraph >= 0.4.0",
  # SSSOM
  "sssom >= 0.4.0",
  # OAK for ontology querying
  "oaklib >= 0.6.0",
  # Database
  "duckdb >= 1.0.0",
  # AI agents
  "pydantic-ai >= 0.0.13",
  "pydantic >= 2.0.0",
  # HTTP/API
  "httpx >= 0.28.0",
  # Utilities
  "pyyaml >= 6.0",
  "python-dotenv >= 1.0.0",
  # CURIE handling
  "curies >= 0.7.0",
  # Validation (local dependency)
  "sieve",
  "fastapi>=0.128.0",
  "uvicorn>=0.40.0",
  "jinja2>=3.1.6",
  "python-multipart>=0.0.21",
]

[tool.uv.sources]
sieve = { path = "../sieve", editable = true }

[dependency-groups]
dev = [
    "linkml>=1.9.3",
    "linkml-reference-validator>=0.1.0",
    "linkml-term-validator>=0.0.1",
    "mypy>=1.17.1",
    "ruff>=0.4.8",
    "mkdocs-material>=8.2.8",
    "mkdocs-mermaid2-plugin>=1.1.1",
    "jupyter>=1.0.0",
    "mknotebooks>= 0.8.0",
    "pytest-asyncio>=0.24.0",
    "types-PyYAML>=6.0",
    "matplotlib>=3.10.8",
]

[project.scripts]
mondo-ai = "mondo_ai.cli:main"


# See https://hatch.pypa.io/latest/config/build/#file-selection for how to
# explicitly include files other than default into the build distributions.

[tool.hatch.version]
source = "uv-dynamic-versioning"

# Ref.: https://github.com/ninoseki/uv-dynamic-versioning/
[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

# Ref.: https://docs.pytest.org/en/stable/reference/reference.html#configuration-options
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (require API keys, make real API calls)",
]

# Ref.: https://github.com/codespell-project/codespell
[tool.codespell]
skip = [
  "LICENSE",
  "pyproject.toml",
  "uv.lock",
  "project/*",
  "src/mondo_ai/datamodel/mondo_ai_pydantic.py",
  "src/mondo_ai/datamodel/mondo_ai.py",
]

# Reminder: words have to be lowercased for the ignore-words-list
ignore-words-list = "linke"
quiet-level = 3

# Ref.: https://github.com/crate-ci/typos (spell checker)
[tool.typos.default.extend-words]
linke = "linke"
[tool.typos.files]
extend-exclude = [
  "LICENSE",
  "uv.lock",
  "pyproject.toml",
  "project/*",
  "src/mondo_ai/datamodel/mondo_ai_pydantic.py",
  "src/mondo_ai/datamodel/mondo_ai.py",
]

[tool.ruff]
exclude = [
  "src/mondo_ai/datamodel/mondo_ai.py",
  "src/mondo_ai/datamodel/mondo_ai_pydantic.py",
]
