# MondoAI Pipeline Configuration
# ================================
# Sources, their per-content evidence weights (the strength a claim from that source
# contributes, 0-1), and the parameters of the aggregation rules behind the inclusion
# score S (frozen into every packet's reference_snapshot). Rule parameters are
# illustrative, as in sieve's example registry; calibrating them is the D-063 task.

resources:
- id: omim
  name: OMIM
  url: https://github.com/monarch-initiative/omim/releases/latest/download/omim.owl
  infores: infores:omim
  curie_prefixes:
  - OMIM
  - OMIMPS
  iri_filter: omim.org/entry/
  quality: 0.9
  default_role: PRIMARY
  derives_content_from: []
  enabled_content:
  - synonyms
  - hierarchy
  - mappings
  content_weights:
    exact_synonym: 0.95
    related_synonym: 0.85
    broad_synonym: 0.75
    narrow_synonym: 0.75
    label: 0.95
    definition: 0.9
    parent: 0.8
    mapping: 0.5
    default: 0.7
  enabled: true
- id: ordo
  name: Orphanet Rare Disease Ontology
  url: https://www.orphadata.com/data/ontologies/ordo/last_version/ORDO_en_4.9.owl
  infores: infores:orphanet
  curie_prefixes:
  - Orphanet
  iri_filter: Orphanet_
  quality: 0.9
  default_role: PRIMARY
  derives_content_from: []
  enabled_content:
  - synonyms
  - hierarchy
  - mappings
  content_weights:
    exact_synonym: 0.9
    related_synonym: 0.8
    broad_synonym: 0.7
    narrow_synonym: 0.7
    label: 0.9
    definition: 0.85
    parent: 0.85
    mapping: 0.8
    default: 0.7
  enabled: true
- id: doid
  name: Disease Ontology
  url: http://purl.obolibrary.org/obo/doid.owl
  infores: infores:disease-ontology
  curie_prefixes:
  - DOID
  iri_filter: DOID_
  quality: 0.8
  default_role: PRIMARY
  derives_content_from:
  - omim
  enabled_content:
  - synonyms
  - hierarchy
  - mappings
  content_weights:
    exact_synonym: 0.85
    related_synonym: 0.75
    broad_synonym: 0.65
    narrow_synonym: 0.65
    label: 0.85
    definition: 0.8
    parent: 0.8
    mapping: 0.5
    default: 0.7
  enabled: true
- id: icd10cm
  name: ICD-10-CM
  url: http://purl.obolibrary.org/obo/mondo/sources/icd10cm.owl
  infores: infores:icd10cm
  curie_prefixes:
  - ICD10CM
  iri_filter: ontology/ICD10CM/
  quality: 0.8
  default_role: PRIMARY
  derives_content_from: []
  enabled_content:
  - synonyms
  - hierarchy
  - mappings
  content_weights:
    exact_synonym: 0.8
    related_synonym: 0.7
    broad_synonym: 0.6
    narrow_synonym: 0.6
    label: 0.8
    definition: 0.7
    parent: 0.6
    mapping: 0.5
    default: 0.7
  enabled: true
mondo:
  owl_url: http://purl.obolibrary.org/obo/mondo.owl
  sssom_url: http://purl.obolibrary.org/obo/mondo/mappings/mondo.sssom.tsv
  cache_dir: data/cache
scoring:
  rule_version: '1.0'
  scaling_factor: 2.0
  default_quality: 0.5
  confidence_floor: 0.3
  source_ingest_prior: 0.0
  strength_bands:
  - strong >= 0.8
  - moderate >= 0.4
  - weak < 0.4
enrichment:
  enabled: false
  min_score_for_enrichment: -0.5
  max_papers_per_packet: 5
  cache_dir: data/references_cache
agent:
  enabled: true
  provider: anthropic
  model: claude-sonnet-4-20250514
  prompt_version: v1
  max_tokens: 1024
  temperature: 0.0
storage:
  backend: duckdb
  db_path: packet_index/mondo_ai.duckdb
  packet_dir: evidence_packets
  runs_dir: runs
jsonl_storage:
  enabled: true
  store_dir: packet_store
  max_file_size_mb: 50
