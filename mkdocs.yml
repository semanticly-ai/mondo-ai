---
site_name: "mondo-ai"
theme:
  name: material
  features:
    - content.tabs.link
    - content.code.copy
    - navigation.instant
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# for adding extra css/js see https://www.mkdocs.org/user-guide/customizing-your-theme/

plugins:
  - search
  - mknotebooks:
      execute: false
  - mermaid2:
      version: 11.4.1
  
#watch:
#  - src/mondo_ai/schema

nav:
  - Home: index.md
  - Pipeline Guide: pipeline.md
  - Ontology Alignment: alignment.md
  - Mapping Review Guide: mapping-review-guide.md
  - Curation Rules: maprule.md
  - Evidence Browser: evidence/index.md
  
exclude_docs: |
  /templates-linkml/

site_url: https://monarch-initiative.github.io/mondo-ai
repo_url: https://github.com/monarch-initiative/mondo-ai
